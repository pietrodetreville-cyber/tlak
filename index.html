<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b3261e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>Tlak</title>
<style>
:root{--bg:#f6f4f1;--card:#fff;--fg:#1d1b1a;--mut:#6b6560;--acc:#b3261e;--line:#e3ded8;--ok:#1b7f3b}
@media (prefers-color-scheme:dark){:root{--bg:#161413;--card:#211f1e;--fg:#f1ede9;--mut:#a39c95;--line:#37332f;--acc:#ff6b61;--ok:#5fd07f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif;padding:0 16px calc(24px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto}
h1{font-size:1.3rem;margin:18px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
button,.btn{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:var(--acc);color:#fff;font-weight:600;cursor:pointer;display:inline-block;text-align:center}
button.sec{background:transparent;color:var(--fg);border:1px solid var(--line)}
button.big{width:100%;padding:18px;font-size:1.15rem}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 0;min-width:90px}
label{display:block;font-size:.8rem;color:var(--mut);margin-bottom:3px}
input{font:inherit;width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
input.num{font-size:1.6rem;font-weight:700;text-align:center}
#status{color:var(--mut);font-size:.9rem;margin:8px 0}
#preview{max-width:100%;border-radius:10px;margin-top:10px;display:none}
.warn{color:var(--acc);font-size:.85rem;margin:6px 0}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
td.n{font-weight:700;white-space:nowrap}
td button{padding:4px 10px;background:transparent;color:var(--mut);border:1px solid var(--line);font-weight:400}
.note{color:var(--mut);font-size:.82rem}
.hide{display:none}
</style>
</head>
<body>
<main>
<h1>Tlak</h1>

<div class="card">
  <label class="btn big" for="cam" style="display:block">📷 Vyfotit tonometr</label>
  <input id="cam" type="file" accept="image/*" capture="environment" class="hide">
  <div id="status"></div>
  <img id="preview" alt="">
</div>

<form id="form" class="card">
  <div class="row">
    <div><label for="sys">Horní</label><input class="num" id="sys" type="number" inputmode="numeric" min="30" max="300" required></div>
    <div><label for="dia">Dolní</label><input class="num" id="dia" type="number" inputmode="numeric" min="20" max="200" required></div>
    <div><label for="pul">Tep</label><input class="num" id="pul" type="number" inputmode="numeric" min="20" max="250" required></div>
  </div>
  <div id="warn" class="warn"></div>
  <div style="margin-top:10px"><label for="when">Datum a čas</label><input id="when" type="datetime-local" required></div>
  <div style="margin-top:10px"><label for="note">Poznámka (nepovinná)</label><input id="note" type="text" placeholder="např. po kávě"></div>
  <div class="row" style="margin-top:12px">
    <button type="submit">Uložit</button>
    <button type="button" class="sec" id="clear">Vymazat</button>
  </div>
</form>

<div class="card">
  <div class="row" style="align-items:center;margin-bottom:8px">
    <strong style="flex:2">Záznamy (<span id="count">0</span>)</strong>
    <button class="sec" id="export">Export pro Excel</button>
  </div>
  <table><thead><tr><th>Kdy</th><th>Tlak</th><th>Tep</th><th></th></tr></thead><tbody id="list"></tbody></table>
  <p class="note" id="empty">Zatím nic. Vyfoť displej nebo čísla zadej ručně.</p>
  <p class="note">Data jsou jen v tomto telefonu. Export (CSV) otevřeš v Excelu. Doporučuju ho čas od času stáhnout jako zálohu.</p>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const KEY = 'tlak.records.v1';
let records = [];
try { records = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) {}
const save = () => localStorage.setItem(KEY, JSON.stringify(records));
const pad = n => String(n).padStart(2, '0');
const nowLocal = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmt = s => { const d = new Date(s); return `${d.getDate()}. ${d.getMonth()+1}. ${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render() {
  const sorted = [...records].sort((a, b) => b.when.localeCompare(a.when));
  $('list').innerHTML = sorted.map(r =>
    `<tr><td>${fmt(r.when)}${r.note ? `<div class="note">${esc(r.note)}</div>` : ''}</td>
     <td class="n">${r.sys}/${r.dia}</td><td class="n">${r.pul}</td>
     <td><button data-del="${r.id}" aria-label="Smazat">✕</button></td></tr>`).join('');
  $('count').textContent = records.length;
  $('empty').style.display = records.length ? 'none' : '';
}

function checkWarn() {
  const s = +$('sys').value, d = +$('dia').value;
  $('warn').textContent = (s && d && s <= d) ? 'Horní tlak by měl být vyšší než dolní, zkontroluj hodnoty.' : '';
}
['sys','dia'].forEach(i => $(i).addEventListener('input', checkWarn));

function resetForm() {
  $('form').reset(); $('when').value = nowLocal(); $('warn').textContent = '';
  $('preview').style.display = 'none'; $('status').textContent = '';
}
resetForm();
$('clear').onclick = resetForm;

$('form').addEventListener('submit', e => {
  e.preventDefault();
  records.push({ id: Date.now().toString(36), when: $('when').value, sys: +$('sys').value, dia: +$('dia').value, pul: +$('pul').value, note: $('note').value.trim() });
  save(); render(); resetForm();
});
$('list').addEventListener('click', e => {
  const id = e.target.dataset.del;
  if (id && confirm('Smazat tento záznam?')) { records = records.filter(r => r.id !== id); save(); render(); }
});

$('export').onclick = () => {
  if (!records.length) return alert('Zatím není co exportovat.');
  const sorted = [...records].sort((a, b) => a.when.localeCompare(b.when));
  const q = s => '"' + String(s).replace(/"/g, '""') + '"';
  const lines = ['Datum;Čas;Horní;Dolní;Tep;Poznámka'];
  for (const r of sorted) {
    const d = new Date(r.when);
    lines.push([`${d.getDate()}.${d.getMonth()+1}.${d.getFullYear()}`, `${pad(d.getHours())}:${pad(d.getMinutes())}`, r.sys, r.dia, r.pul, q(r.note)].join(';'));
  }
  const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `tlak-${nowLocal().slice(0,10)}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
};

// ---------- čtení z fotky ----------
function loadImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => res({ img, url }); img.onerror = rej; img.src = url;
  });
}
// zmenšení + šedá + roztažení kontrastu; invert = světlé číslice na tmavém
function prep(img, invert) {
  const max = 1400, k = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  const x = c.getContext('2d', { willReadFrequently: true });
  x.drawImage(img, 0, 0, c.width, c.height);
  const d = x.getImageData(0, 0, c.width, c.height), p = d.data, g = new Uint8Array(p.length / 4);
  const hist = new Uint32Array(256);
  for (let i = 0; i < g.length; i++) { const v = (p[i*4]*0.299 + p[i*4+1]*0.587 + p[i*4+2]*0.114) | 0; g[i] = v; hist[v]++; }
  const cut = g.length * 0.02; let lo = 0, hi = 255, s = 0;
  for (; lo < 255; lo++) { s += hist[lo]; if (s > cut) break; }
  s = 0; for (; hi > 0; hi--) { s += hist[hi]; if (s > cut) break; }
  const span = Math.max(1, hi - lo);
  for (let i = 0; i < g.length; i++) {
    let v = Math.max(0, Math.min(255, (g[i] - lo) * 255 / span)); if (invert) v = 255 - v;
    p[i*4] = p[i*4+1] = p[i*4+2] = v;
  }
  x.putImageData(d, 0, 0);
  return c;
}
function pick(words) {
  // čísla v rozumném rozsahu, seřazená odshora dolů (Omron: horní, dolní, tep)
  const nums = words.map(w => ({ t: w.text.replace(/\D/g, ''), y: (w.bbox.y0 + w.bbox.y1) / 2, h: w.bbox.y1 - w.bbox.y0 }))
    .filter(w => w.t.length >= 2 && w.t.length <= 3 && +w.t >= 30 && +w.t <= 260);
  if (!nums.length) return null;
  const hMax = Math.max(...nums.map(n => n.h));
  const big = nums.filter(n => n.h > hMax * 0.45).sort((a, b) => a.y - b.y);
  return big.length >= 3 ? big.slice(0, 3).map(n => +n.t) : null;
}

let worker = null;
$('cam').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  const st = $('status');
  try {
    st.textContent = 'Načítám fotku…';
    const { img, url } = await loadImage(file);
    $('preview').src = url; $('preview').style.display = 'block';
    if (!window.Tesseract) throw new Error('offline');
    st.textContent = 'Čtu čísla… (poprvé to chvíli trvá, stahuje se rozpoznávač)';
    if (!worker) {
      worker = await Tesseract.createWorker('eng');
      await worker.setParameters({ tessedit_char_whitelist: '0123456789', tessedit_pageseg_mode: '11' });
    }
    let found = null;
    for (const inv of [false, true]) {
      const { data } = await worker.recognize(prep(img, inv));
      found = pick(data.words || []);
      if (found) break;
    }
    if (found) {
      [$('sys').value, $('dia').value, $('pul').value] = found; checkWarn();
      st.textContent = 'Přečteno. Zkontroluj čísla podle fotky a ulož.';
    } else {
      st.textContent = 'Čísla se nepodařilo spolehlivě přečíst. Zkus fotku zblízka a bez odlesků, nebo je opiš ručně.';
    }
  } catch (err) {
    st.textContent = err.message === 'offline'
      ? 'Rozpoznávání vyžaduje při prvním spuštění internet. Čísla zatím zadej ručně.'
      : 'Fotku se nepodařilo zpracovat. Zadej čísla ručně.';
  }
});

render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
