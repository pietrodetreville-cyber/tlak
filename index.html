<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b3261e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>Tlak</title>
<style>
:root{--bg:#f6f4f1;--card:#fff;--fg:#1d1b1a;--mut:#6b6560;--acc:#b3261e;--line:#e3ded8;--ok:#1b7f3b}
@media (prefers-color-scheme:dark){:root{--bg:#161413;--card:#211f1e;--fg:#f1ede9;--mut:#a39c95;--line:#37332f;--acc:#ff6b61;--ok:#5fd07f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif;padding:0 16px calc(24px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto}
h1{font-size:1.3rem;margin:18px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
button,.btn{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:var(--acc);color:#fff;font-weight:600;cursor:pointer;display:inline-block;text-align:center}
button.sec{background:transparent;color:var(--fg);border:1px solid var(--line)}
button.big{width:100%;padding:18px;font-size:1.15rem}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 0;min-width:90px}
label{display:block;font-size:.8rem;color:var(--mut);margin-bottom:3px}
input{font:inherit;width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
input.num{font-size:1.6rem;font-weight:700;text-align:center}
#status{color:var(--mut);font-size:.9rem;margin:8px 0}
#preview{max-width:100%;border-radius:10px;margin-top:10px;display:none}
.warn{color:var(--acc);font-size:.85rem;margin:6px 0}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
td.n{font-weight:700;white-space:nowrap}
td button{padding:4px 10px;background:transparent;color:var(--mut);border:1px solid var(--line);font-weight:400}
#vf{position:fixed;inset:0;background:#000;z-index:10}
#vf.hide{display:none}
#vf video{width:100%;height:100%;object-fit:cover}
#frame{position:absolute;left:50%;top:44%;width:78vmin;height:78vmin;transform:translate(-50%,-50%);border:3px solid #fff;border-radius:14px;box-shadow:0 0 0 100vmax rgba(0,0,0,.55)}
#hint{position:absolute;left:0;right:0;top:calc(44% - 39vmin - 40px);text-align:center;color:#fff;font-weight:600}
#bar{position:absolute;left:16px;right:16px;bottom:calc(24px + env(safe-area-inset-bottom));display:flex;gap:12px}
#bar button{flex:1}#bar .sec{color:#fff;border-color:#fff8}
.note{color:var(--mut);font-size:.82rem}
.hide{display:none}
</style>
</head>
<body>
<main>
<h1>Tlak <span class="note" id="ver"></span></h1>
<div id="upd" class="card hide" style="border-color:var(--acc)"><strong>Je k dispozici nová verze.</strong><div class="row" style="margin-top:8px"><button id="updgo" type="button">Aktualizovat</button></div></div>

<div class="card">
  <button class="big" id="open" type="button">📷 Vyfotit displej</button>
  <label class="note" for="cam" style="display:block;margin-top:10px;text-align:center;text-decoration:underline">nebo vybrat hotovou fotku</label>
  <input id="cam" type="file" accept="image/*" class="hide">
  <div id="status"></div>
  <canvas id="dbg" style="max-width:100%;border-radius:10px;margin-top:6px;display:none"></canvas>
  <canvas id="preview" style="max-width:100%;border-radius:10px;margin-top:10px;display:none"></canvas>
</div>

<div id="vf" class="hide">
  <video id="video" playsinline muted></video>
  <div id="frame"></div>
  <div id="hint">Displej vyplň do rámečku</div>
  <div id="bar"><button class="sec" id="vfclose" type="button">Zavřít</button><button id="shot" type="button">Vyfotit</button></div>
</div>

<form id="form" class="card">
  <div class="row">
    <div><label for="sys">Horní</label><input class="num" id="sys" type="number" inputmode="numeric" min="30" max="300" required></div>
    <div><label for="dia">Dolní</label><input class="num" id="dia" type="number" inputmode="numeric" min="20" max="200" required></div>
    <div><label for="pul">Tep</label><input class="num" id="pul" type="number" inputmode="numeric" min="20" max="250" required></div>
  </div>
  <div id="warn" class="warn"></div>
  <div style="margin-top:10px"><label for="when">Datum a čas</label><input id="when" type="datetime-local" required></div>
  <div style="margin-top:10px"><label for="note">Poznámka (nepovinná)</label><input id="note" type="text" placeholder="např. po kávě"></div>
  <div class="row" style="margin-top:12px">
    <button type="submit">Uložit</button>
    <button type="button" class="sec" id="clear">Vymazat</button>
  </div>
</form>

<div class="card">
  <div class="row" style="align-items:center;margin-bottom:8px">
    <strong style="flex:2">Záznamy (<span id="count">0</span>)</strong>
    <button class="sec" id="export">Export pro Excel</button>
  </div>
  <table><thead><tr><th>Kdy</th><th>Tlak</th><th>Tep</th><th></th></tr></thead><tbody id="list"></tbody></table>
  <p class="note" id="empty">Zatím nic. Vyfoť displej nebo čísla zadej ručně.</p>
  <p class="note">Data jsou jen v tomto telefonu. Export (CSV) otevřeš v Excelu. Doporučuju ho čas od času stáhnout jako zálohu.</p>
</div>
</main>

<script src="seg7.js"></script>
<script>
const $ = id => document.getElementById(id);
const KEY = 'tlak.records.v1';
let records = [];
try { records = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) {}
const save = () => localStorage.setItem(KEY, JSON.stringify(records));
const pad = n => String(n).padStart(2, '0');
const nowLocal = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmt = s => { const d = new Date(s); return `${d.getDate()}. ${d.getMonth()+1}. ${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render() {
  const sorted = [...records].sort((a, b) => b.when.localeCompare(a.when));
  $('list').innerHTML = sorted.map(r =>
    `<tr><td>${fmt(r.when)}${r.note ? `<div class="note">${esc(r.note)}</div>` : ''}</td>
     <td class="n">${r.sys}/${r.dia}</td><td class="n">${r.pul}</td>
     <td><button data-del="${r.id}" aria-label="Smazat">✕</button></td></tr>`).join('');
  $('count').textContent = records.length;
  $('empty').style.display = records.length ? 'none' : '';
}

function checkWarn() {
  const s = +$('sys').value, d = +$('dia').value;
  $('warn').textContent = (s && d && s <= d) ? 'Horní tlak by měl být vyšší než dolní, zkontroluj hodnoty.' : '';
}
['sys','dia'].forEach(i => $(i).addEventListener('input', checkWarn));

function resetForm() {
  $('form').reset(); $('when').value = nowLocal(); $('warn').textContent = '';
  $('preview').style.display = 'none'; $('status').textContent = '';
}
resetForm();
$('clear').onclick = resetForm;

$('form').addEventListener('submit', e => {
  e.preventDefault();
  records.push({ id: Date.now().toString(36), when: $('when').value, sys: +$('sys').value, dia: +$('dia').value, pul: +$('pul').value, note: $('note').value.trim() });
  save(); render(); resetForm();
});
$('list').addEventListener('click', e => {
  const id = e.target.dataset.del;
  if (id && confirm('Smazat tento záznam?')) { records = records.filter(r => r.id !== id); save(); render(); }
});

$('export').onclick = () => {
  if (!records.length) return alert('Zatím není co exportovat.');
  const sorted = [...records].sort((a, b) => a.when.localeCompare(b.when));
  const q = s => '"' + String(s).replace(/"/g, '""') + '"';
  const lines = ['Datum;Čas;Horní;Dolní;Tep;Poznámka'];
  for (const r of sorted) {
    const d = new Date(r.when);
    lines.push([`${d.getDate()}.${d.getMonth()+1}.${d.getFullYear()}`, `${pad(d.getHours())}:${pad(d.getMinutes())}`, r.sys, r.dia, r.pul, q(r.note)].join(';'));
  }
  const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `tlak-${nowLocal().slice(0,10)}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
};

// ---------- čtení z fotky ----------
function readCanvas(cv) {
  const x = cv.getContext('2d', { willReadFrequently: true }), d = x.getImageData(0, 0, cv.width, cv.height).data;
  const g = new Uint8Array(cv.width * cv.height);
  for (let i = 0; i < g.length; i++) g[i] = (d[i*4]*0.299 + d[i*4+1]*0.587 + d[i*4+2]*0.114) | 0;
  return Seg7.read(g, cv.width, cv.height);
}
const plausible = v => v && v.every((n, i) => n >= [60, 30, 30][i] && n <= [280, 200, 250][i]);
function showResult(cv) {
  const p = $('preview'); p.width = cv.width; p.height = cv.height; p.getContext('2d').drawImage(cv, 0, 0); p.style.display = 'block';
  const r = readCanvas(cv), st = $('status');
  $('dbg').style.display = 'none';
  if (plausible(r.vals)) {
    [$('sys').value, $('dia').value, $('pul').value] = r.vals; checkWarn();
    st.textContent = 'Přečteno. Zkontroluj čísla podle fotky a ulož.';
  } else {
    st.textContent = 'Čísla se nepodařilo přečíst' + (r.vals ? ' (přečteno ' + r.vals.join('/') + ', mimo rozsah)' : ' (' + (r.error || '?') + ')') + '. Vyfoť displej zblízka, rovně a bez odlesků, nebo čísla opiš ručně. Pod fotkou je černobílý náhled, jak ho appka vidí.';
    const g = new Uint8Array(cv.width * cv.height), d = cv.getContext('2d').getImageData(0, 0, cv.width, cv.height);
    for (let i = 0; i < g.length; i++) g[i] = (d.data[i*4]*0.299 + d.data[i*4+1]*0.587 + d.data[i*4+2]*0.114) | 0;
    const bin = Seg7.binarize(g, cv.width, cv.height), o = $('dbg'), od = new ImageData(cv.width, cv.height);
    o.width = cv.width; o.height = cv.height;
    for (let i = 0; i < bin.length; i++) { const v = bin[i] ? 0 : 255; od.data[i*4] = od.data[i*4+1] = od.data[i*4+2] = v; od.data[i*4+3] = 255; }
    o.getContext('2d').putImageData(od, 0, 0); o.style.display = 'block'; return;
  }
}

let stream = null;
function closeVf() { if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; $('vf').classList.add('hide'); }
$('open').onclick = async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
    $('video').srcObject = stream; await $('video').play(); $('vf').classList.remove('hide');
  } catch (e) {
    closeVf(); $('status').textContent = 'Foťák se nepodařilo spustit. Povol ho v prohlížeči, nebo vyber hotovou fotku.';
  }
};
$('vfclose').onclick = closeVf;
$('shot').onclick = () => {
  const v = $('video'), vw = v.videoWidth, vh = v.videoHeight, c = v.getBoundingClientRect(), f = $('frame').getBoundingClientRect();
  const k = Math.max(c.width / vw, c.height / vh), ox = (vw * k - c.width) / 2, oy = (vh * k - c.height) / 2;
  const sx = (f.left - c.left + ox) / k, sy = (f.top - c.top + oy) / k, sw = f.width / k, sh = f.height / k;
  const out = Math.min(600, Math.round(sw)), cv = document.createElement('canvas');
  cv.width = out; cv.height = Math.round(out * sh / sw);
  cv.getContext('2d').drawImage(v, sx, sy, sw, sh, 0, 0, cv.width, cv.height);
  closeVf(); showResult(cv);
};
// hotová fotka: zkusí celý snímek i několik výřezů
$('cam').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = ''; if (!file) return;
  try {
    const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }), k = Math.min(1, 1200 / Math.max(bmp.width, bmp.height));
    const W = Math.round(bmp.width * k), H = Math.round(bmp.height * k);
    const full = document.createElement('canvas'); full.width = W; full.height = H; full.getContext('2d').drawImage(bmp, 0, 0, W, H);
    const tries = [[0, 0, 1, 1]];
    for (const s of [0.7, 0.5, 0.35]) for (const cy of [0.35, 0.5, 0.65]) for (const cx of [0.35, 0.5, 0.65]) tries.push([cx - s / 2, cy - s / 2, s, s]);
    for (const [fx, fy, fw, fh] of tries) {
      const cv = document.createElement('canvas'); cv.width = Math.round(W * fw); cv.height = Math.round(H * fh);
      cv.getContext('2d').drawImage(full, W * fx, H * fy, cv.width, cv.height, 0, 0, cv.width, cv.height);
      if (plausible(readCanvas(cv).vals)) { showResult(cv); return; }
    }
    showResult(full);
  } catch (err) { $('status').textContent = 'Fotku se nepodařilo zpracovat. Zadej čísla ručně.'; }
});

render();
const VERSION = 3;
$('ver').textContent = 'verze ' + VERSION;
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(reg => {
    const offer = w => { $('upd').classList.remove('hide'); $('updgo').onclick = () => w.postMessage('skip'); };
    if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
    reg.addEventListener('updatefound', () => { const w = reg.installing; w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) offer(w); }); });
    reg.update().catch(() => {});
    document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
  }).catch(() => {});
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (reloaded) return; reloaded = true; location.reload(); });
}
</script>
</body>
</html>
